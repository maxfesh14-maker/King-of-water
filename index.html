<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Эволюция планктона</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #0a0f1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        .game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .game-container {
            background: #0b1a2e;
            padding: 12px;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 80px #0077ff22;
            border: 1px solid #1e3a5f;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: inset 0 0 80px #00000088, 0 0 40px #1e90ff33;
            cursor: none;
            touch-action: none;
        }
        .stats {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            color: #b3e4ff;
            font-weight: 500;
            text-shadow: 0 0 8px #1e90ff;
            letter-spacing: 1px;
            z-index: 10;
            pointer-events: none;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }
        .stats span {
            background: #0d2a44dd;
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid #2e6a9e;
            box-shadow: 0 0 15px #0077ff44, inset 0 0 10px #00000066;
            backdrop-filter: blur(6px);
            font-size: 13px;
        }
        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #7aa9d9;
            font-size: 13px;
            z-index: 10;
            text-shadow: 0 0 10px #1e90ff;
            pointer-events: none;
            text-align: center;
            padding: 0 12px;
            max-width: 90vw;
        }

        /* Индикатор зума */
        .zoom-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #b3e4ff;
            font-size: 12px;
            background: #0d2a44dd;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #2e6a9e;
            box-shadow: 0 0 15px #0077ff44;
            backdrop-filter: blur(6px);
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 8px #1e90ff;
        }

        .evolution-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 10, 25, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
            padding: 20px;
            overflow-y: auto;
        }
        .evolution-modal.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .evolution-box {
            background: linear-gradient(160deg, #0d2a44, #071a2e);
            border: 2px solid #2e6a9e;
            border-radius: 32px;
            padding: 40px 50px;
            box-shadow: 0 0 80px #0077ff66, inset 0 0 40px #00000088;
            text-align: center;
            max-width: 820px;
            width: 100%;
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .evolution-box h2 {
            color: #b3e4ff;
            font-size: 34px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px #1e90ff;
            letter-spacing: 2px;
        }
        .evolution-box p {
            color: #7aa9d9;
            font-size: 16px;
            margin-bottom: 32px;
        }
        .evolution-options {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .evo-card {
            background: #0b1a2e;
            border: 2px solid #1e3a5f;
            border-radius: 24px;
            padding: 28px 24px;
            width: 200px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .evo-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #1e90ff;
            box-shadow: 0 15px 35px #0077ff55, 0 0 25px #0077ff44;
        }
        .evo-card:active { transform: scale(0.98); }
        .evo-emoji {
            font-size: 64px;
            line-height: 1;
            filter: drop-shadow(0 0 15px currentColor);
        }
        .evo-card .evo-name {
            color: #b3e4ff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .evo-card .evo-desc {
            color: #7aa9d9;
            font-size: 13px;
            line-height: 1.4;
        }
        .evo-fish { color: #f4a261; }
        .evo-crab { color: #e76f51; }
        .evo-octopus { color: #9d4edd; }
        .evo-fish .evo-name { color: #f4a261; }
        .evo-crab .evo-name { color: #e76f51; }
        .evo-octopus .evo-name { color: #9d4edd; }
        .evo-god { color: #ffd700; }
        .evo-god .evo-name { color: #ffd700; }

        .joystick {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(13, 42, 68, 0.55);
            border: 2px solid rgba(46, 106, 158, 0.7);
            box-shadow: 0 0 25px #0077ff55, inset 0 0 25px #00000088;
            display: none;
            z-index: 100;
            touch-action: none;
            backdrop-filter: blur(6px);
        }
        .joystick.active { display: block; }
        .joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #5ea8e0, #1e90ff);
            box-shadow: 0 0 20px #1e90ffaa, inset 0 0 15px #ffffff55;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .joystick-label {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            color: #7aa9d9;
            font-size: 12px;
            white-space: nowrap;
            text-shadow: 0 0 8px #1e90ff;
        }

        @media (max-width: 768px) {
            .stats span { padding: 6px 12px; font-size: 11px; }
            .evolution-box { padding: 24px 20px; }
            .evolution-box h2 { font-size: 24px; }
            .evolution-box p { font-size: 13px; margin-bottom: 20px; }
            .evo-card { width: 130px; padding: 18px 12px; }
            .evo-emoji { font-size: 44px; }
            .evo-card .evo-name { font-size: 16px; }
            .evo-card .evo-desc { font-size: 11px; }
            .hint { font-size: 11px; }
            .zoom-indicator { font-size: 10px; padding: 4px 10px; bottom: 14px; right: 14px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="stats">
        <span>🧬 <span id="evoDisplay">Планктон</span></span>
        <span>❤️ <span id="healthDisplay">100</span></span>
        <span>🍽️ <span id="scoreDisplay">0</span></span>
        <span>⚡ <span id="epDisplay">0</span></span>
        <span>🌿 <span id="foodDisplay">0/5</span></span>
    </div>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>
    <div class="hint" id="hint">← ↑ → ↓ / WASD • Ешь всё, что меньше тебя • R — перезапуск</div>
    <div class="zoom-indicator" id="zoomIndicator">🔍 x1.00</div>

    <div class="joystick" id="joystick">
        <div class="joystick-knob" id="joystickKnob"></div>
        <div class="joystick-label">Движение</div>
    </div>
</div>

<div class="evolution-modal" id="evoModal">
    <div class="evolution-box">
        <h2 id="evoTitle">✨ ЭВОЛЮЦИЯ! ✨</h2>
        <p id="evoSubtitle">Ты накопил достаточно энергии. Выбери свой путь:</p>
        <div class="evolution-options" id="evoOptions"></div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const evoDisplay = document.getElementById('evoDisplay');
        const healthDisplay = document.getElementById('healthDisplay');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const epDisplay = document.getElementById('epDisplay');
        const foodDisplay = document.getElementById('foodDisplay');
        const evoModal = document.getElementById('evoModal');
        const evoTitle = document.getElementById('evoTitle');
        const evoSubtitle = document.getElementById('evoSubtitle');
        const evoOptions = document.getElementById('evoOptions');
        const joystick = document.getElementById('joystick');
        const joystickKnob = document.getElementById('joystickKnob');
        const hint = document.getElementById('hint');
        const zoomIndicator = document.getElementById('zoomIndicator');

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
                         ('ontouchstart' in window && window.innerWidth < 1024);
        if (isMobile) {
            joystick.classList.add('active');
            hint.textContent = 'Джойстик слева • Ешь всё, что меньше тебя';
        }

        // ---------- РАЗМЕРЫ ----------
        let VIEW_W = Math.min(window.innerWidth - 40, 1280);
        let VIEW_H = Math.min(window.innerHeight - 100, 800);
        const WORLD_W = 16000;
        const WORLD_H = 12000;

        function resizeCanvas() {
            VIEW_W = Math.min(window.innerWidth - 40, 1280);
            VIEW_H = Math.min(window.innerHeight - (isMobile ? 60 : 100), 800);
            canvas.width = VIEW_W;
            canvas.height = VIEW_H;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

        // ---------- КАМЕРА И ЗУМ ----------
        const camera = { x: 0, y: 0, zoom: 1, targetZoom: 1 };

        // Расчёт целевого зума в зависимости от размера игрока
        // Чем больше игрок — тем меньше зум (шире обзор)
        function calculateTargetZoom() {
            // Базовый зум 1.0 для планктона (r=8), уменьшается при росте
            // Минимальный зум — 0.35 (при r=160)
            const baseRadius = TYPES.PLANKTON.r; // 8
            const ratio = baseRadius / Math.max(player.r, baseRadius);
            // Применяем кривую для более плавного уменьшения
            const zoom = Math.max(0.35, Math.pow(ratio, 0.7));
            return zoom;
        }

        // ---------- ТИПЫ СУЩЕСТВ ----------
        const TYPES = {
            PLANKTON:      { name: 'Планктон',      color: '#7ec8e0', r: 8,   speed: 1.2, emoji: '🟢', tier: 0, branch: null,      damage: 0,  hp: 0,   huntRadius: 0,   spawnWeight: 0.50, maxCount: 300, epReward: 1 },

            FISH:          { name: 'Рыба',          color: '#f4a261', r: 18,  speed: 2.6, emoji: '🐟', tier: 1, branch: 'fish',    damage: 10, hp: 15,  huntRadius: 0,   spawnWeight: 0.18, maxCount: 50, epReward: 3 },
            CRAB:          { name: 'Краб',          color: '#e76f51', r: 26,  speed: 1.6, emoji: '🦀', tier: 1, branch: 'crab',    damage: 15, hp: 30,  huntRadius: 0,   spawnWeight: 0.09, maxCount: 25, epReward: 4 },
            OCTOPUS:       { name: 'Осьминог',      color: '#9d4edd', r: 36,  speed: 2.1, emoji: '🐙', tier: 1, branch: 'octopus', damage: 20, hp: 25,  huntRadius: 0,   spawnWeight: 0.05, maxCount: 14, epReward: 5 },

            FISH_BIG:      { name: 'Акула',         color: '#7a8a9a', r: 30,  speed: 2.4, emoji: '🦈', tier: 2, branch: 'fish',    damage: 30, hp: 60,  huntRadius: 220, spawnWeight: 0.04, maxCount: 8,  epReward: 10 },
            CRAB_KING:     { name: 'Король-краб',   color: '#c44d2a', r: 38,  speed: 1.5, emoji: '🦞', tier: 2, branch: 'crab',    damage: 35, hp: 80,  huntRadius: 180, spawnWeight: 0.03, maxCount: 7,  epReward: 12 },
            KRAKEN:        { name: 'Кракен',        color: '#5a189a', r: 50,  speed: 1.9, emoji: '🦑', tier: 2, branch: 'octopus', damage: 45, hp: 100, huntRadius: 260, spawnWeight: 0.02, maxCount: 5,  epReward: 15 },

            MEGALODON:     { name: 'Мегалодон',     color: '#4a5a6a', r: 46,  speed: 2.3, emoji: '🐋', tier: 3, branch: 'fish',    damage: 55, hp: 150, huntRadius: 300, spawnWeight: 0.015, maxCount: 4, epReward: 30 },
            EMPEROR_CRAB:  { name: 'Император',     color: '#8b1a1a', r: 56,  speed: 1.4, emoji: '🦀', tier: 3, branch: 'crab',    damage: 60, hp: 200, huntRadius: 260, spawnWeight: 0.012, maxCount: 4, epReward: 35 },
            COLOSSAL:      { name: 'Колоссаль',     color: '#3a0a5a', r: 70,  speed: 1.8, emoji: '🐙', tier: 3, branch: 'octopus', damage: 70, hp: 180, huntRadius: 320, spawnWeight: 0.01,  maxCount: 3, epReward: 40 },

            LEVIATHAN:     { name: 'Левиафан',      color: '#1a2a3a', r: 75,  speed: 2.5, emoji: '🐉', tier: 4, branch: 'fish',    damage: 90,  hp: 350, huntRadius: 400, spawnWeight: 0.008, maxCount: 2, epReward: 80 },
            TITAN_CRAB:    { name: 'Титан-краб',    color: '#5a0a0a', r: 88,  speed: 1.6, emoji: '🦖', tier: 4, branch: 'crab',    damage: 100, hp: 450, huntRadius: 350, spawnWeight: 0.006, maxCount: 2, epReward: 90 },
            OCEAN_GOD:     { name: 'Владыка Глубин', color: '#2a0a4a', r: 105, speed: 2.0, emoji: '👁️', tier: 4, branch: 'octopus', damage: 120, hp: 500, huntRadius: 450, spawnWeight: 0.005, maxCount: 2, epReward: 100 },

            STAR_EATER:    { name: 'Пожиратель Звёзд', color: '#ffe066', r: 130, speed: 2.8, emoji: '⭐', tier: 5, branch: 'fish',    damage: 160, hp: 800,  huntRadius: 550, spawnWeight: 0.003, maxCount: 1, epReward: 250 },
            VOID_EMPEROR:  { name: 'Император Пустоты', color: '#1a0033', r: 145, speed: 1.9, emoji: '🌑', tier: 5, branch: 'crab',    damage: 180, hp: 1000, huntRadius: 500, spawnWeight: 0.002, maxCount: 1, epReward: 280 },
            ABYSS_LORD:    { name: 'Владыка Бездны',   color: '#4a0080', r: 160, speed: 2.2, emoji: '🔮', tier: 5, branch: 'octopus', damage: 200, hp: 1200, huntRadius: 600, spawnWeight: 0.001, maxCount: 1, epReward: 300 }
        };

        const EP_REQUIRED = {
            0: 5, 1: 15, 2: 40, 3: 90, 4: 200
        };

        const EVOLUTION_TREE = {
            PLANKTON:    ['FISH', 'CRAB', 'OCTOPUS'],
            FISH:        ['FISH_BIG'],
            CRAB:        ['CRAB_KING'],
            OCTOPUS:     ['KRAKEN'],
            FISH_BIG:    ['MEGALODON'],
            CRAB_KING:   ['EMPEROR_CRAB'],
            KRAKEN:      ['COLOSSAL'],
            MEGALODON:   ['LEVIATHAN'],
            EMPEROR_CRAB:['TITAN_CRAB'],
            COLOSSAL:    ['OCEAN_GOD'],
            LEVIATHAN:   ['STAR_EATER'],
            TITAN_CRAB:  ['VOID_EMPEROR'],
            OCEAN_GOD:   ['ABYSS_LORD'],
            STAR_EATER:  null,
            VOID_EMPEROR: null,
            ABYSS_LORD:  null
        };

        const EVO_DESCRIPTIONS = {
            FISH:        { name: 'Рыба',              desc: 'Быстрая и ловкая<br>Скорость: ★★★★<br>HP: ★★',          cls: 'evo-fish' },
            CRAB:        { name: 'Краб',              desc: 'Крепкий панцирь<br>Скорость: ★★<br>HP: ★★★',            cls: 'evo-crab' },
            OCTOPUS:     { name: 'Осьминог',          desc: 'Умный и сильный<br>Скорость: ★★★<br>HP: ★★★',          cls: 'evo-octopus' },
            FISH_BIG:    { name: 'Акула',             desc: 'Гроза океана<br>Скорость: ★★★★★<br>HP: ★★★★',         cls: 'evo-fish' },
            CRAB_KING:   { name: 'Король-краб',       desc: 'Владыка дна<br>Скорость: ★★★<br>HP: ★★★★★',              cls: 'evo-crab' },
            KRAKEN:      { name: 'Кракен',            desc: 'Легенда глубин<br>Скорость: ★★★★<br>HP: ★★★★★',       cls: 'evo-octopus' },
            MEGALODON:   { name: 'Мегалодон',         desc: 'Древний хищник<br>Скорость: ★★★★★<br>HP: ★★★★★★',     cls: 'evo-fish' },
            EMPEROR_CRAB:{ name: 'Император',         desc: 'Броня из хитина<br>Скорость: ★★★<br>HP: ★★★★★★★',     cls: 'evo-crab' },
            COLOSSAL:    { name: 'Колоссаль',         desc: 'Ужас пучины<br>Скорость: ★★★★<br>HP: ★★★★★★★',       cls: 'evo-octopus' },
            LEVIATHAN:   { name: 'Левиафан',          desc: '🐉 БОГ ОКЕАНА 🐉<br>Скорость: ★★★★★★<br>HP: ★★★★★★★★', cls: 'evo-fish' },
            TITAN_CRAB:  { name: 'Титан-краб',        desc: '🦖 НЕСОКРУШИМЫЙ 🦖<br>Скорость: ★★★★<br>HP: ★★★★★★★★★', cls: 'evo-crab' },
            OCEAN_GOD:   { name: 'Владыка Глубин',    desc: '👁️ АБСОЛЮТ 👁️<br>Скорость: ★★★★★<br>HP: ★★★★★★★★★★',   cls: 'evo-octopus' },
            STAR_EATER:  { name: 'Пожиратель Звёзд',  desc: '⭐ КОСМИЧЕСКАЯ ФОРМА ⭐<br>Скорость: ★★★★★★★<br>HP: ★★★★★★★★★★★', cls: 'evo-god' },
            VOID_EMPEROR: { name: 'Император Пустоты', desc: '🌑 ПОВЕЛИТЕЛЬ НИЧЕГО 🌑<br>Скорость: ★★★★★★<br>HP: ★★★★★★★★★★★★', cls: 'evo-god' },
            ABYSS_LORD:  { name: 'Владыка Бездны',    desc: '🔮 АБСОЛЮТНАЯ СИЛА 🔮<br>Скорость: ★★★★★★★<br>HP: ★★★★★★★★★★★★★', cls: 'evo-god' }
        };

        // ---------- ИГРОК ----------
        let player = {
            x: WORLD_W/2, y: WORLD_H/2,
            vx: 0, vy: 0,
            r: TYPES.PLANKTON.r,
            speed: TYPES.PLANKTON.speed,
            type: 'PLANKTON',
            angle: 0,
            tailPhase: 0,
            tentaclePhase: 0,
            hp: 100,
            maxHp: 100,
            invulnerable: 0,
            damageFlash: 0,
            ep: 0
        };

        let entities = [];
        let foods = [];
        let particles = [];
        let damageNumbers = [];
        let score = 0;
        let gameOver = false;
        let win = false;
        let waitingForChoice = false;
        let globalAggroCooldown = 0;

        const keys = {
            ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false,
            a: false, d: false, w: false, s: false,
            A: false, D: false, W: false, S: false
        };

        // ---------- ДЖОЙСТИК ----------
        const joystickInput = { x: 0, y: 0, active: false };
        let joystickTouchId = null;
        const JOYSTICK_CENTER = { x: 0, y: 0 };
        const JOYSTICK_MAX_DIST = 55;

        function updateJoystickCenter() {
            const rect = joystick.getBoundingClientRect();
            JOYSTICK_CENTER.x = rect.left + rect.width / 2;
            JOYSTICK_CENTER.y = rect.top + rect.height / 2;
        }

        function handleJoystickStart(e) {
            e.preventDefault();
            const touch = e.changedTouches ? e.changedTouches[0] : e;
            joystickTouchId = touch.identifier !== undefined ? touch.identifier : 'mouse';
            joystickInput.active = true;
            updateJoystickCenter();
            handleJoystickMove(e);
        }

        function handleJoystickMove(e) {
            if (!joystickInput.active) return;
            e.preventDefault();
            let touch;
            if (e.changedTouches) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === joystickTouchId) {
                        touch = e.changedTouches[i];
                        break;
                    }
                }
                if (!touch) return;
            } else {
                touch = e;
            }
            const dx = touch.clientX - JOYSTICK_CENTER.x;
            const dy = touch.clientY - JOYSTICK_CENTER.y;
            const dist = Math.hypot(dx, dy);
            const clampedDist = Math.min(dist, JOYSTICK_MAX_DIST);
            const angle = Math.atan2(dy, dx);
            const knobX = Math.cos(angle) * clampedDist;
            const knobY = Math.sin(angle) * clampedDist;
            joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;

            if (dist > 5) {
                joystickInput.x = (Math.cos(angle) * clampedDist) / JOYSTICK_MAX_DIST;
                joystickInput.y = (Math.sin(angle) * clampedDist) / JOYSTICK_MAX_DIST;
            } else {
                joystickInput.x = 0;
                joystickInput.y = 0;
            }
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            joystickInput.active = false;
            joystickInput.x = 0;
            joystickInput.y = 0;
            joystickTouchId = null;
            joystickKnob.style.transform = 'translate(-50%, -50%)';
        }

        joystick.addEventListener('touchstart', handleJoystickStart, { passive: false });
        joystick.addEventListener('touchmove', handleJoystickMove, { passive: false });
        joystick.addEventListener('touchend', handleJoystickEnd);
        joystick.addEventListener('touchcancel', handleJoystickEnd);
        joystick.addEventListener('mousedown', handleJoystickStart);
        window.addEventListener('mousemove', (e) => {
            if (joystickInput.active && joystickTouchId === 'mouse') handleJoystickMove(e);
        });
        window.addEventListener('mouseup', () => {
            if (joystickTouchId === 'mouse') handleJoystickEnd({ preventDefault: () => {} });
        });

        // ---------- ГЕНЕРАЦИЯ ----------
        function countByType(type) {
            let c = 0;
            for (const e of entities) if (e.type === type) c++;
            return c;
        }

        function pickSpawnType() {
            const available = [];
            let totalWeight = 0;
            for (const key in TYPES) {
                const t = TYPES[key];
                if (key === 'PLANKTON') {
                    available.push({ type: key, weight: t.spawnWeight });
                    totalWeight += t.spawnWeight;
                } else {
                    if (countByType(key) < t.maxCount) {
                        available.push({ type: key, weight: t.spawnWeight });
                        totalWeight += t.spawnWeight;
                    }
                }
            }
            if (available.length === 0) return 'PLANKTON';

            let r = Math.random() * totalWeight;
            for (const item of available) {
                r -= item.weight;
                if (r <= 0) return item.type;
            }
            return available[0].type;
        }

        function spawnEntity(type) {
            const t = TYPES[type];
            let x, y, tries = 0;
            do {
                x = 60 + Math.random() * (WORLD_W - 120);
                y = 60 + Math.random() * (WORLD_H - 120);
                tries++;
            } while (Math.hypot(x - player.x, y - player.y) < 600 && tries < 35);

            const maxHp = t.hp || 10;
            entities.push({
                x, y,
                r: t.r,
                type: type,
                color: t.color,
                speed: t.speed * (0.7 + Math.random() * 0.8),
                vx: (Math.random() - 0.5) * 1.2,
                vy: (Math.random() - 0.5) * 1.2,
                angle: Math.random() * Math.PI * 2,
                tailPhase: Math.random() * 100,
                wigglePhase: Math.random() * 100,
                patternSeed: Math.random() * 1000,
                hp: maxHp,
                maxHp: maxHp,
                damage: t.damage || 0,
                attackCooldown: 0,
                damageFlash: 0,
                aggroTimer: 0,
                hunting: false,
                huntGiveUp: 0
            });
        }

        function spawnFood() {
            let x, y, tries = 0;
            do {
                x = 40 + Math.random() * (WORLD_W - 80);
                y = 40 + Math.random() * (WORLD_H - 80);
                tries++;
            } while (Math.hypot(x - player.x, y - player.y) < 200 && tries < 20);

            foods.push({
                x, y,
                r: 6,
                phase: Math.random() * Math.PI * 2,
                bob: 0,
                drift: Math.random() * Math.PI * 2,
                heal: 8
            });
        }

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 1 + Math.random() * 4;
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    r: 2 + Math.random() * 4,
                    life: 1,
                    color: color
                });
            }
        }

        function spawnDamageNumber(x, y, value, color, prefix = '') {
            damageNumbers.push({
                x, y, value: prefix + value, color,
                vy: -1.5,
                life: 1
            });
        }

        function initGame() {
            entities = [];
            foods = [];
            particles = [];
            damageNumbers = [];
            score = 0;
            globalAggroCooldown = 0;
            player.x = WORLD_W/2;
            player.y = WORLD_H/2;
            player.vx = 0;
            player.vy = 0;
            player.type = 'PLANKTON';
            player.r = TYPES.PLANKTON.r;
            player.speed = TYPES.PLANKTON.speed;
            player.angle = 0;
            player.hp = 100;
            player.maxHp = 100;
            player.invulnerable = 0;
            player.damageFlash = 0;
            player.ep = 0;
            gameOver = false;
            win = false;
            waitingForChoice = false;

            // Сброс зума
            camera.zoom = 1;
            camera.targetZoom = 1;

            for (let i = 0; i < 400; i++) spawnEntity('PLANKTON');
            for (let i = 0; i < 50; i++) spawnEntity('FISH');
            for (let i = 0; i < 20; i++) spawnEntity('CRAB');
            for (let i = 0; i < 12; i++) spawnEntity('OCTOPUS');
            for (let i = 0; i < 6; i++) spawnEntity('FISH_BIG');
            for (let i = 0; i < 5; i++) spawnEntity('CRAB_KING');
            for (let i = 0; i < 4; i++) spawnEntity('KRAKEN');
            for (let i = 0; i < 3; i++) spawnEntity('MEGALODON');
            for (let i = 0; i < 2; i++) spawnEntity('EMPEROR_CRAB');
            for (let i = 0; i < 2; i++) spawnEntity('COLOSSAL');
            for (let i = 0; i < 1; i++) spawnEntity('LEVIATHAN');
            for (let i = 0; i < 1; i++) spawnEntity('TITAN_CRAB');

            for (let i = 0; i < 350; i++) spawnFood();

            camera.x = player.x - VIEW_W/2;
            camera.y = player.y - VIEW_H/2;

            updateUI();
        }

        function updateUI() {
            evoDisplay.textContent = TYPES[player.type].name;
            healthDisplay.textContent = Math.max(0, Math.round(player.hp));
            scoreDisplay.textContent = score;
            epDisplay.textContent = player.ep;
            const required = getCurrentEPRequirement();
            if (required === 0) {
                foodDisplay.textContent = '✧';
            } else {
                foodDisplay.textContent = `${player.ep}/${required}`;
            }
            // Индикатор зума
            zoomIndicator.textContent = `🔍 x${camera.zoom.toFixed(2)}`;
        }

        function getCurrentEPRequirement() {
            const tier = TYPES[player.type].tier;
            if (tier >= 5) return 0;
            return EP_REQUIRED[tier] || 0;
        }

        // ---------- ОКНО ВЫБОРА ЭВОЛЮЦИИ ----------
        function openEvolutionChoice() {
            waitingForChoice = true;
            const options = EVOLUTION_TREE[player.type];
            if (!options) return;

            const tier = TYPES[player.type].tier;
            if (player.type === 'PLANKTON') {
                evoTitle.textContent = '✨ ЭВОЛЮЦИЯ! ✨';
                evoSubtitle.textContent = 'Ты накопил достаточно энергии. Выбери свой путь:';
            } else if (tier === 1) {
                evoTitle.textContent = '⚡ ПРОДВИНУТАЯ ЭВОЛЮЦИЯ! ⚡';
                evoSubtitle.textContent = `Ты — ${TYPES[player.type].name}. Готов стать сильнее?`;
            } else if (tier === 2) {
                evoTitle.textContent = '🔥 МОНСТР-ЭВОЛЮЦИЯ! 🔥';
                evoSubtitle.textContent = `Ты — ${TYPES[player.type].name}. Впереди — путь монстра!`;
            } else if (tier === 3) {
                evoTitle.textContent = '👑 ФИНАЛЬНАЯ ФОРМА! 👑';
                evoSubtitle.textContent = `Ты — ${TYPES[player.type].name}. Стань БОГОМ ОКЕАНА!`;
            } else if (tier === 4) {
                evoTitle.textContent = '🌟 АБСОЛЮТНАЯ ФОРМА! 🌟';
                evoSubtitle.textContent = `Ты — ${TYPES[player.type].name}. За гранью океана ждёт нечто большее...`;
            }

            evoOptions.innerHTML = '';
            options.forEach(optType => {
                const info = EVO_DESCRIPTIONS[optType];
                if (!info) return;
                const card = document.createElement('div');
                card.className = `evo-card ${info.cls}`;
                card.dataset.type = optType;
                card.innerHTML = `
                    <div class="evo-emoji">${TYPES[optType].emoji}</div>
                    <div class="evo-name">${info.name}</div>
                    <div class="evo-desc">${info.desc}</div>
                `;
                card.addEventListener('click', () => {
                    applyEvolution(optType);
                    evoModal.classList.remove('active');
                    waitingForChoice = false;
                    player.ep = 0;
                    updateUI();
                });
                card.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    applyEvolution(optType);
                    evoModal.classList.remove('active');
                    waitingForChoice = false;
                    player.ep = 0;
                    updateUI();
                }, { passive: false });
                evoOptions.appendChild(card);
            });

            evoModal.classList.add('active');
        }

        function applyEvolution(type) {
            const t = TYPES[type];
            spawnParticles(player.x, player.y, t.color, 70);
            spawnParticles(player.x, player.y, '#ffffff', 35);
            player.type = type;
            player.r = t.r;
            player.speed = t.speed;
            player.vx *= 0.3;
            player.vy *= 0.3;
            const newMaxHp = 100 + t.tier * 60;
            player.maxHp = newMaxHp;
            player.hp = Math.min(newMaxHp, player.hp + 80);
            player.invulnerable = 90;
            updateUI();
        }

        // ---------- БОЙ ----------
        function damagePlayer(amount, sourceX, sourceY) {
            if (player.invulnerable > 0) return;
            player.hp -= amount;
            player.invulnerable = 40;
            player.damageFlash = 15;
            globalAggroCooldown = 90;
            for (const e of entities) {
                if (e.hunting) {
                    e.hunting = false;
                    e.huntGiveUp = 120;
                }
            }
            spawnDamageNumber(player.x, player.y - player.r - 10, amount, '#ff4444', '-');
            spawnParticles(player.x, player.y, '#ff4444', 12);

            const dx = player.x - sourceX;
            const dy = player.y - sourceY;
            const dist = Math.hypot(dx, dy) || 1;
            player.vx += (dx / dist) * 4;
            player.vy += (dy / dist) * 4;

            if (player.hp <= 0) {
                player.hp = 0;
                gameOver = true;
                spawnParticles(player.x, player.y, '#ff4444', 50);
            }
            updateUI();
        }

        function damageEntity(entity, amount) {
            entity.hp -= amount;
            entity.damageFlash = 10;
            spawnDamageNumber(entity.x, entity.y - entity.r - 5, amount, '#ffaa00', '-');
            if (entity.hp <= 0) {
                spawnParticles(entity.x, entity.y, entity.color, 12);
                return true;
            }
            return false;
        }

        // ---------- ОБНОВЛЕНИЕ ----------
        function update(dt) {
            if (gameOver || waitingForChoice) return;

            let ax = 0, ay = 0;
            if (keys.ArrowLeft || keys.a || keys.A) ax -= 1;
            if (keys.ArrowRight || keys.d || keys.D) ax += 1;
            if (keys.ArrowUp || keys.w || keys.W) ay -= 1;
            if (keys.ArrowDown || keys.s || keys.S) ay += 1;

            if (joystickInput.active && (Math.abs(joystickInput.x) > 0.1 || Math.abs(joystickInput.y) > 0.1)) {
                ax = joystickInput.x;
                ay = joystickInput.y;
            }

            const inputMag = Math.hypot(ax, ay);
            if (inputMag > 0.05) {
                ax /= Math.max(inputMag, 1);
                ay /= Math.max(inputMag, 1);
                player.vx += ax * 0.6 * inputMag;
                player.vy += ay * 0.6 * inputMag;
            }

            player.vx *= 0.88;
            player.vy *= 0.88;

            const maxSpd = player.speed * 3;
            const spd = Math.hypot(player.vx, player.vy);
            if (spd > maxSpd) {
                player.vx = player.vx / spd * maxSpd;
                player.vy = player.vy / spd * maxSpd;
            }

            player.x += player.vx;
            player.y += player.vy;

            player.x = Math.min(WORLD_W - player.r, Math.max(player.r, player.x));
            player.y = Math.min(WORLD_H - player.r, Math.max(player.r, player.y));

            if (Math.hypot(player.vx, player.vy) > 0.2) {
                const targetAngle = Math.atan2(player.vy, player.vx);
                let diff = targetAngle - player.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                player.angle += diff * 0.2;
            }

            player.tailPhase += 0.25 + Math.hypot(player.vx, player.vy) * 0.1;
            player.tentaclePhase += 0.1;

            if (player.invulnerable > 0) player.invulnerable--;
            if (player.damageFlash > 0) player.damageFlash--;
            if (globalAggroCooldown > 0) globalAggroCooldown--;

            // ---------- ЗУМ ----------
            camera.targetZoom = calculateTargetZoom();
            camera.zoom += (camera.targetZoom - camera.zoom) * 0.02;

            // ---------- КАМЕРА (учитывая зум) ----------
            // Видимая область в мировых координатах зависит от зума
            const viewWorldW = VIEW_W / camera.zoom;
            const viewWorldH = VIEW_H / camera.zoom;
            const targetCamX = player.x - viewWorldW / 2;
            const targetCamY = player.y - viewWorldH / 2;
            camera.x += (targetCamX - camera.x) * 0.1;
            camera.y += (targetCamY - camera.y) * 0.1;

            // --- ОБНОВЛЕНИЕ NPC ---
            let activeHunters = 0;

            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                const t = TYPES[e.type];
                e.wigglePhase += 0.06;
                e.tailPhase += 0.15 + Math.hypot(e.vx, e.vy) * 0.05;
                if (e.damageFlash > 0) e.damageFlash--;
                if (e.attackCooldown > 0) e.attackCooldown--;
                if (e.aggroTimer > 0) e.aggroTimer--;
                if (e.huntGiveUp > 0) e.huntGiveUp--;

                const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                const canHunt = (e.r > player.r * 1.15 && e.damage > 0 && t.huntRadius > 0);

                let shouldHunt = false;
                if (canHunt && globalAggroCooldown === 0 && e.huntGiveUp === 0) {
                    if (e.hunting) {
                        shouldHunt = distToPlayer < t.huntRadius * 1.5;
                    } else {
                        if (distToPlayer < t.huntRadius && activeHunters < 2) {
                            shouldHunt = true;
                        }
                    }
                }

                if (shouldHunt) {
                    if (!e.hunting) activeHunters++;
                    e.hunting = true;
                    e.aggroTimer = 60;
                    const angleToPlayer = Math.atan2(player.y - e.y, player.x - e.x);
                    const huntSpeed = e.speed * 0.7;
                    e.vx += Math.cos(angleToPlayer) * 0.14;
                    e.vy += Math.sin(angleToPlayer) * 0.14;

                    const espd = Math.hypot(e.vx, e.vy);
                    if (espd > huntSpeed * 1.4) {
                        e.vx = e.vx / espd * huntSpeed * 1.4;
                        e.vy = e.vy / espd * huntSpeed * 1.4;
                    }
                } else {
                    if (e.hunting) {
                        e.hunting = false;
                        e.huntGiveUp = 180;
                    }
                    e.vx += (Math.random() - 0.5) * 0.12;
                    e.vy += (Math.random() - 0.5) * 0.12;
                    const maxSpeed = e.speed * 1.8;
                    const espd = Math.hypot(e.vx, e.vy);
                    if (espd > maxSpeed) {
                        e.vx = e.vx / espd * maxSpeed;
                        e.vy = e.vy / espd * maxSpeed;
                    }
                }

                e.x += e.vx;
                e.y += e.vy;

                if (e.x < e.r || e.x > WORLD_W - e.r) { e.vx *= -1; e.x = Math.min(WORLD_W - e.r, Math.max(e.r, e.x)); }
                if (e.y < e.r || e.y > WORLD_H - e.r) { e.vy *= -1; e.y = Math.min(WORLD_H - e.r, Math.max(e.r, e.y)); }

                if (Math.hypot(e.vx, e.vy) > 0.15) {
                    const targetAngle = Math.atan2(e.vy, e.vx);
                    let diff = targetAngle - e.angle;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    e.angle += diff * 0.15;
                }

                if (distToPlayer < player.r + e.r - 2) {
                    if (player.r > e.r * 1.05) {
                        score++;
                        player.ep += t.epReward || 1;
                        spawnParticles(e.x, e.y, e.color, 8);
                        spawnDamageNumber(e.x, e.y - e.r - 15, t.epReward || 1, '#ffd700', '+');
                        entities.splice(i, 1);
                        const newType = pickSpawnType();
                        spawnEntity(newType);
                        updateUI();
                        continue;
                    } else if (e.r > player.r * 1.15 && e.damage > 0) {
                        if (e.attackCooldown === 0) {
                            damagePlayer(e.damage, e.x, e.y);
                            e.attackCooldown = 50;
                        }
                    } else if (player.r > e.r * 0.9 && player.r < e.r * 1.15) {
                        if (e.attackCooldown === 0) {
                            const dmg = Math.max(3, Math.floor(player.r * 0.5));
                            if (damageEntity(e, dmg)) {
                                score++;
                                player.ep += t.epReward || 1;
                                spawnDamageNumber(e.x, e.y - e.r - 15, t.epReward || 1, '#ffd700', '+');
                                entities.splice(i, 1);
                                const newType = pickSpawnType();
                                spawnEntity(newType);
                                updateUI();
                                continue;
                            }
                            e.attackCooldown = 40;
                            if (e.damage > 0) {
                                damagePlayer(Math.floor(e.damage * 0.5), e.x, e.y);
                            }
                        }
                    }
                }
            }

            // --- ЕДА ---
            for (let i = foods.length - 1; i >= 0; i--) {
                const f = foods[i];
                f.phase += 0.06;
                f.drift += 0.01;
                f.bob = Math.sin(f.phase) * 3;
                f.x += Math.cos(f.drift) * 0.15;
                f.y += Math.sin(f.drift) * 0.15;

                if (f.x < 20) f.x = 20;
                if (f.x > WORLD_W - 20) f.x = WORLD_W - 20;
                if (f.y < 20) f.y = 20;
                if (f.y > WORLD_H - 20) f.y = WORLD_H - 20;

                const dist = Math.hypot(player.x - f.x, player.y - (f.y + f.bob));
                if (dist < player.r + f.r + 4) {
                    foods.splice(i, 1);
                    spawnParticles(f.x, f.y + f.bob, '#7cfc00', 6);

                    const heal = Math.min(f.heal, player.maxHp - player.hp);
                    if (heal > 0) {
                        player.hp += heal;
                        spawnDamageNumber(player.x, player.y - player.r - 10, heal, '#7cfc00', '+');
                    }

                    player.ep += 2;
                    
                    const tier = TYPES[player.type].tier;
                    if (tier <= 4) {
                        const required = getCurrentEPRequirement();
                        if (required > 0 && player.ep >= required) {
                            setTimeout(() => {
                                if (!gameOver && !waitingForChoice) {
                                    const currentTier = TYPES[player.type].tier;
                                    if (currentTier <= 4 && EVOLUTION_TREE[player.type]) {
                                        openEvolutionChoice();
                                    }
                                }
                            }, 200);
                        }
                    }
                    spawnFood();
                    updateUI();
                }
            }

            // --- ЧАСТИЦЫ ---
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.94;
                p.vy *= 0.94;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = damageNumbers.length - 1; i >= 0; i--) {
                const d = damageNumbers[i];
                d.y += d.vy;
                d.vy *= 0.94;
                d.life -= 0.02;
                if (d.life <= 0) damageNumbers.splice(i, 1);
            }

            if (player.type === 'PLANKTON' && player.hp < player.maxHp) {
                player.hp = Math.min(player.maxHp, player.hp + 0.02);
            }

            while (foods.length < 350) spawnFood();
            if (entities.length < 600) {
                for (let i = 0; i < 8; i++) {
                    const type = pickSpawnType();
                    spawnEntity(type);
                }
            }

            const tier = TYPES[player.type].tier;
            if (tier === 5 && score >= 800 && !win) {
                win = true;
            }

            updateUI();
        }

        // ---------- ОТРИСОВКА ----------
        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
            grad.addColorStop(0, '#0d3552');
            grad.addColorStop(0.4, '#0a2338');
            grad.addColorStop(1, '#03101c');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, VIEW_W, VIEW_H);

            const lightGrad = ctx.createRadialGradient(VIEW_W/2, -100, 100, VIEW_W/2, -100, VIEW_H * 0.9);
            lightGrad.addColorStop(0, 'rgba(100, 200, 255, 0.15)');
            lightGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = lightGrad;
            ctx.fillRect(0, 0, VIEW_W, VIEW_H);

            // Сетка (с учётом зума)
            ctx.save();
            ctx.strokeStyle = 'rgba(80, 180, 240, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 200;
            // Размер сетки на экране с учётом зума
            const screenGridSize = gridSize * camera.zoom;
            const offsetX = -((camera.x * camera.zoom) % screenGridSize);
            const offsetY = -((camera.y * camera.zoom) % screenGridSize);
            for (let x = offsetX; x < VIEW_W; x += screenGridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, VIEW_H); ctx.stroke();
            }
            for (let y = offsetY; y < VIEW_H; y += screenGridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(VIEW_W, y); ctx.stroke();
            }
            ctx.restore();

            if (!window.bubbles) {
                window.bubbles = [];
                for (let i = 0; i < 300; i++) {
                    window.bubbles.push({
                        x: Math.random() * WORLD_W,
                        y: Math.random() * WORLD_H,
                        r: Math.random() * 5 + 2,
                        speed: Math.random() * 0.3 + 0.1,
                        parallax: 0.3 + Math.random() * 0.5,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            window.bubbles.forEach(b => {
                b.y -= b.speed;
                b.phase += 0.02;
                if (b.y < -20) { b.y = WORLD_H + 20; b.x = Math.random() * WORLD_W; }
                const sx = (b.x - camera.x * b.parallax) * camera.zoom;
                const sy = (b.y - camera.y * b.parallax) * camera.zoom;
                if (sx < -20 || sx > VIEW_W + 20 || sy < -20 || sy > VIEW_H + 20) return;
                const wobble = Math.sin(b.phase) * 2;
                const screenR = b.r * camera.zoom;
                ctx.beginPath();
                ctx.arc(sx + wobble, sy, Math.max(screenR, 1), 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(180, 230, 255, 0.15)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            if (!window.bottomDots) {
                window.bottomDots = [];
                for (let i = 0; i < 900; i++) {
                    window.bottomDots.push({
                        x: Math.random() * WORLD_W,
                        y: WORLD_H * 0.5 + Math.random() * WORLD_H * 0.5,
                        r: Math.random() * 3 + 1,
                        shade: Math.random()
                    });
                }
            }
            window.bottomDots.forEach(d => {
                const sx = (d.x - camera.x * 0.5) * camera.zoom;
                const sy = (d.y - camera.y * 0.5) * camera.zoom;
                if (sx < -10 || sx > VIEW_W + 10 || sy < -10 || sy > VIEW_H + 10) return;
                const screenR = d.r * camera.zoom;
                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(screenR, 0.5), 0, Math.PI * 2);
                ctx.fillStyle = d.shade > 0.5 ? 'rgba(30, 60, 90, 0.4)' : 'rgba(50, 100, 140, 0.3)';
                ctx.fill();
            });
        }

        function drawCreature(x, y, r, type, color, angle, tailPhase, wigglePhase, isPlayer) {
            ctx.save();
            ctx.translate(x, y);

            if (type === 'PLANKTON') {
                const pulse = 1 + Math.sin(tailPhase * 0.5) * 0.12;
                const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 3.5);
                glow.addColorStop(0, color + 'cc');
                glow.addColorStop(0.4, color + '44');
                glow.addColorStop(1, color + '00');
                ctx.fillStyle = glow;
                ctx.beginPath(); ctx.arc(0, 0, r * 3.5, 0, Math.PI * 2); ctx.fill();

                const grad = ctx.createRadialGradient(-r*0.3, -r*0.3, 0, 0, 0, r * pulse);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.5, color);
                grad.addColorStop(1, '#2a6b8a');
                ctx.fillStyle = grad;
                ctx.beginPath(); ctx.arc(0, 0, r * pulse, 0, Math.PI * 2); ctx.fill();

                for (let i = 0; i < 4; i++) {
                    const a = tailPhase * 0.5 + i * Math.PI / 2;
                    const dx = Math.cos(a) * r * 0.4;
                    const dy = Math.sin(a) * r * 0.4;
                    ctx.beginPath(); ctx.arc(dx, dy, r * 0.15, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.fill();
                }
            } else if (type === 'FISH' || type === 'FISH_BIG' || type === 'MEGALODON' || type === 'LEVIATHAN' || type === 'STAR_EATER') {
                const fishTypes = { FISH: 0, FISH_BIG: 1, MEGALODON: 2, LEVIATHAN: 3, STAR_EATER: 4 };
                const level = fishTypes[type] || 0;
                ctx.rotate(angle);

                const palettes = [
                    { body: '#f4a261', belly: '#ffd9a0', dark: '#b8561d', fin: '#f4a261', eye: '#0a0f1e' },
                    { body: '#7a8a9a', belly: '#b0c0d0', dark: '#3a4a5a', fin: '#7a8a9a', eye: '#000000' },
                    { body: '#4a5a6a', belly: '#8a9aa8', dark: '#1a2a3a', fin: '#4a5a6a', eye: '#ff0000' },
                    { body: '#1a2a3a', belly: '#4a5a6a', dark: '#000000', fin: '#1a2a3a', eye: '#00ffff' },
                    { body: '#ffe066', belly: '#fff5b0', dark: '#b8860b', fin: '#ffe066', eye: '#ff00ff' }
                ];
                const p = palettes[level];

                if (level >= 3) {
                    const auraColor = level === 4 ? '255, 224, 102' : '100, 200, 255';
                    const auraStrength = level === 4 ? 0.3 : 0.2;
                    const aura = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.5);
                    aura.addColorStop(0, `rgba(${auraColor}, 0)`);
                    aura.addColorStop(0.7, `rgba(${auraColor}, ${auraStrength})`);
                    aura.addColorStop(1, `rgba(${auraColor}, 0)`);
                    ctx.fillStyle = aura;
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                const tailWag = Math.sin(tailPhase) * (0.35 + level * 0.08);
                ctx.save();
                ctx.translate(-r * 0.9, 0);
                ctx.rotate(tailWag);
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(-r * (1.0 + level * 0.15), -r * (0.6 + level * 0.1));
                ctx.lineTo(-r * 0.5, 0);
                ctx.lineTo(-r * (1.0 + level * 0.15), r * (0.6 + level * 0.1));
                ctx.closePath();
                const tailGrad = ctx.createLinearGradient(0, 0, -r, 0);
                tailGrad.addColorStop(0, p.body);
                tailGrad.addColorStop(1, p.dark);
                ctx.fillStyle = tailGrad;
                ctx.fill();
                ctx.restore();

                ctx.beginPath();
                const finHeight = level >= 3 ? 2.2 : (level >= 2 ? 1.8 : 1.2);
                ctx.moveTo(-r * 0.4, -r * 0.35);
                ctx.lineTo(r * 0.1 + level * r * 0.05, -r * finHeight);
                ctx.lineTo(r * 0.5, -r * 0.35);
                ctx.closePath();
                ctx.fillStyle = p.fin + 'cc';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-r * 0.2, r * 0.3);
                ctx.quadraticCurveTo(0, r * (0.9 + level * 0.1), r * 0.3, r * 0.3);
                ctx.closePath();
                ctx.fillStyle = p.fin + 'cc';
                ctx.fill();

                const bodyGrad = ctx.createRadialGradient(-r*0.2, -r*0.2, 0, 0, 0, r * 1.4);
                bodyGrad.addColorStop(0, p.belly);
                bodyGrad.addColorStop(0.5, p.body);
                bodyGrad.addColorStop(1, p.dark);
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 1.2, r * 0.78, 0, 0, Math.PI * 2);
                ctx.fill();

                if (level === 4) {
                    ctx.fillStyle = '#ffffff';
                    for (let i = 0; i < 8; i++) {
                        const sx = -r * 0.6 + Math.random() * r * 1.2;
                        const sy = -r * 0.4 + Math.random() * r * 0.8;
                        ctx.beginPath();
                        ctx.arc(sx, sy, r * 0.05, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.strokeStyle = p.dark + 'aa';
                ctx.lineWidth = r * 0.05;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(r * 0.3 + i * r * 0.12, -r * 0.3);
                    ctx.lineTo(r * 0.35 + i * r * 0.12, r * 0.3);
                    ctx.stroke();
                }

                if (level >= 1) {
                    ctx.fillStyle = '#ffffff';
                    const startX = r * 0.85;
                    const startY = r * 0.05;
                    const teethCount = 5 + level * 2;
                    for (let i = 0; i < teethCount; i++) {
                        ctx.beginPath();
                        ctx.moveTo(startX - i * r * 0.1, startY);
                        ctx.lineTo(startX - i * r * 0.1 - r * 0.04, startY + r * (0.15 + level * 0.02));
                        ctx.lineTo(startX - i * r * 0.1 - r * 0.08, startY);
                        ctx.closePath();
                        ctx.fill();
                    }
                }

                ctx.beginPath();
                ctx.arc(r * 0.55, -r * 0.15, r * 0.22, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(r * 0.62, -r * 0.15, r * 0.12, 0, Math.PI * 2);
                ctx.fillStyle = p.eye;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(r * 0.65, -r * 0.2, r * 0.04, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            } else if (type === 'CRAB' || type === 'CRAB_KING' || type === 'EMPEROR_CRAB' || type === 'TITAN_CRAB' || type === 'VOID_EMPEROR') {
                const crabTypes = { CRAB: 0, CRAB_KING: 1, EMPEROR_CRAB: 2, TITAN_CRAB: 3, VOID_EMPEROR: 4 };
                const level = crabTypes[type] || 0;
                const legWag = Math.sin(wigglePhase) * 0.15;

                const palettes = [
                    { body: '#e76f51', dark: '#7a2f1a', light: '#ffb08a', eye: '#0a0f1e' },
                    { body: '#c44d2a', dark: '#5a1a08', light: '#ff8a5a', eye: '#0a0f1e' },
                    { body: '#8b1a1a', dark: '#3a0808', light: '#c06060', eye: '#ff0000' },
                    { body: '#5a0a0a', dark: '#1a0000', light: '#800000', eye: '#ff4400' },
                    { body: '#1a0033', dark: '#000000', light: '#4a0080', eye: '#ff00ff' }
                ];
                const p = palettes[level];

                if (level >= 3) {
                    const auraColor = level === 4 ? '150, 0, 200' : '255, 100, 100';
                    const auraStrength = level === 4 ? 0.4 : 0.2;
                    const aura = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.2);
                    aura.addColorStop(0, `rgba(${auraColor}, 0)`);
                    aura.addColorStop(0.7, `rgba(${auraColor}, ${auraStrength})`);
                    aura.addColorStop(1, `rgba(${auraColor}, 0)`);
                    ctx.fillStyle = aura;
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (level >= 1) {
                    ctx.fillStyle = p.dark;
                    const spikeCount = 4 + level * 2;
                    for (let i = 0; i < spikeCount; i++) {
                        const ang = -Math.PI * 0.8 + i * (Math.PI * 1.6 / (spikeCount - 1));
                        const bx = Math.cos(ang) * r * 0.9;
                        const by = Math.sin(ang) * r * 0.7;
                        const tx = Math.cos(ang) * r * (1.3 + level * 0.1);
                        const ty = Math.sin(ang) * r * (1.1 + level * 0.1);
                        ctx.beginPath();
                        ctx.moveTo(bx - r * 0.1, by);
                        ctx.lineTo(tx, ty);
                        ctx.lineTo(bx + r * 0.1, by);
                        ctx.closePath();
                        ctx.fill();
                    }
                }

                ctx.strokeStyle = p.body;
                ctx.lineWidth = r * 0.14;
                ctx.lineCap = 'round';
                for (let side = -1; side <= 1; side += 2) {
                    for (let i = 0; i < 4; i++) {
                        const baseX = -r * 0.4 + i * r * 0.3;
                        const baseY = side * r * 0.7;
                        const kneeX = baseX - r * 0.1;
                        const kneeY = side * r * 1.1;
                        const tipX = baseX - r * 0.25;
                        const tipY = side * r * 1.3 + legWag * r * (i % 2 ? 1 : -1);
                        ctx.beginPath();
                        ctx.moveTo(baseX, baseY);
                        ctx.lineTo(kneeX, kneeY);
                        ctx.lineTo(tipX, tipY);
                        ctx.stroke();
                    }
                }

                for (let side = -1; side <= 1; side += 2) {
                    ctx.save();
                    ctx.translate(r * 0.6, side * r * 0.35);
                    ctx.rotate(side * 0.4 + Math.sin(wigglePhase + side) * 0.15);
                    ctx.strokeStyle = p.body;
                    ctx.lineWidth = r * 0.22;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(r * (0.5 + level * 0.15), 0);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(r * (0.7 + level * 0.15), 0, r * (0.28 + level * 0.05), 0, Math.PI * 2);
                    ctx.fillStyle = p.body; ctx.fill();
                    ctx.beginPath();
                    ctx.arc(r * (0.7 + level * 0.15), 0, r * (0.14 + level * 0.02), 0, Math.PI * 2);
                    ctx.fillStyle = p.dark; ctx.fill();
                    ctx.restore();
                }

                const bodyGrad = ctx.createRadialGradient(-r*0.2, -r*0.2, 0, 0, 0, r * 1.3);
                bodyGrad.addColorStop(0, p.light);
                bodyGrad.addColorStop(0.6, p.body);
                bodyGrad.addColorStop(1, p.dark);
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, r * 1.1, r * 0.85, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = p.dark + '80';
                ctx.lineWidth = r * 0.06;
                for (let i = 0; i < 2 + level; i++) {
                    const yy = -r * 0.5 + i * r * (1.0 / (1 + level));
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.7, yy);
                    ctx.quadraticCurveTo(0, yy - r * 0.15, r * 0.7, yy);
                    ctx.stroke();
                }

                for (let side = -1; side <= 1; side += 2) {
                    ctx.beginPath();
                    ctx.moveTo(r * 0.3, side * r * 0.3);
                    ctx.lineTo(r * 0.55, side * r * 0.55);
                    ctx.strokeStyle = p.body;
                    ctx.lineWidth = r * 0.1;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(r * 0.6, side * r * 0.6, r * (0.15 + level * 0.02), 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff'; ctx.fill();
                    ctx.beginPath();
                    ctx.arc(r * 0.62, side * r * 0.6, r * (0.08 + level * 0.01), 0, Math.PI * 2);
                    ctx.fillStyle = p.eye; ctx.fill();
                }

                if (level >= 1) {
                    const crownColors = ['#ffd700', '#c0c0c0', '#ff4500', '#8b0000', '#ff00ff'];
                    ctx.fillStyle = crownColors[level - 1] || '#ffd700';
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = r * 0.05;
                    const crownY = -r * 1.0;
                    const crownSize = 0.5 + level * 0.08;
                    ctx.beginPath();
                    ctx.moveTo(-r * crownSize, crownY);
                    ctx.lineTo(-r * crownSize, crownY - r * 0.3);
                    ctx.lineTo(-r * crownSize * 0.5, crownY - r * 0.1);
                    ctx.lineTo(0, crownY - r * 0.4);
                    ctx.lineTo(r * crownSize * 0.5, crownY - r * 0.1);
                    ctx.lineTo(r * crownSize, crownY - r * 0.3);
                    ctx.lineTo(r * crownSize, crownY);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                if (level === 4) {
                    ctx.fillStyle = '#ff00ff';
                    ctx.shadowColor = '#ff00ff';
                    ctx.shadowBlur = 25;
                    for (let i = 0; i < 6; i++) {
                        const ang = -Math.PI/2 + (i - 2.5) * 0.25;
                        const dx = Math.cos(ang) * r * 0.9;
                        const dy = Math.sin(ang) * r * 0.9 - r * 1.2;
                        ctx.beginPath();
                        ctx.arc(dx, dy, r * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }
            } else if (type === 'OCTOPUS' || type === 'KRAKEN' || type === 'COLOSSAL' || type === 'OCEAN_GOD' || type === 'ABYSS_LORD') {
                const octoTypes = { OCTOPUS: 0, KRAKEN: 1, COLOSSAL: 2, OCEAN_GOD: 3, ABYSS_LORD: 4 };
                const level = octoTypes[type] || 0;
                const wavePhase = tailPhase * 0.3;

                const palettes = [
                    { body: '#9d4edd', light: '#e0b0ff', dark: '#4a1670', eye: '#1a0a2e', accent: '#ffb0e0' },
                    { body: '#5a189a', light: '#a060e0', dark: '#1a0545', eye: '#ff0000', accent: '#ff70e0' },
                    { body: '#3a0a5a', light: '#8040c0', dark: '#100020', eye: '#ff00ff', accent: '#ff80ff' },
                    { body: '#2a0a4a', light: '#6030a0', dark: '#000010', eye: '#00ffff', accent: '#00ffff' },
                    { body: '#4a0080', light: '#a060e0', dark: '#100020', eye: '#ffffff', accent: '#ff00ff' }
                ];
                const p = palettes[level];

                if (level >= 1) {
                    const auraColor = level === 4 ? '200, 0, 255' : (level === 3 ? '100, 200, 255' : (level === 2 ? '200, 50, 255' : '255, 100, 220'));
                    const auraStrength = level === 4 ? 0.4 : (0.1 + level * 0.05);
                    const aura = ctx.createRadialGradient(0, -r*0.3, 0, 0, -r*0.3, r * (2.5 + level * 0.3));
                    aura.addColorStop(0, `rgba(${auraColor}, 0.0)`);
                    aura.addColorStop(0.7, `rgba(${auraColor}, ${auraStrength})`);
                    aura.addColorStop(1, `rgba(${auraColor}, 0.0)`);
                    ctx.fillStyle = aura;
                    ctx.beginPath();
                    ctx.arc(0, -r*0.3, r * (2.5 + level * 0.3), 0, Math.PI * 2);
                    ctx.fill();
                }

                const tentacleCount = 8 + level * 2;
                for (let i = 0; i < tentacleCount; i++) {
                    const baseAng = (i / tentacleCount) * Math.PI * 2;
                    const baseX = Math.cos(baseAng) * r * 0.5;
                    const baseY = Math.sin(baseAng) * r * 0.5;

                    ctx.save();
                    ctx.beginPath();
                    const segmentLen = r * (1.6 + level * 0.3);
                    const wave = Math.sin(wavePhase + i * 0.6) * 0.5;
                    const endX = baseX + Math.cos(baseAng + wave * 0.3) * segmentLen;
                    const endY = baseY + Math.sin(baseAng + wave * 0.3) * segmentLen;
                    const ctrlX = (baseX + endX) / 2 + Math.cos(baseAng + Math.PI/2) * r * 0.4;
                    const ctrlY = (baseY + endY) / 2 + Math.sin(baseAng + Math.PI/2) * r * 0.4;

                    ctx.moveTo(baseX, baseY);
                    ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
                    ctx.strokeStyle = p.body;
                    ctx.lineWidth = r * (0.22 - level * 0.02);
                    ctx.lineCap = 'round';
                    ctx.stroke();

                    for (let s = 0.2; s < 1; s += 0.25) {
                        const t = s;
                        const px = (1-t)*(1-t)*baseX + 2*(1-t)*t*ctrlX + t*t*endX;
                        const py = (1-t)*(1-t)*baseY + 2*(1-t)*t*ctrlY + t*t*endY;
                        ctx.beginPath();
                        ctx.arc(px, py, r * 0.05, 0, Math.PI * 2);
                        ctx.fillStyle = p.accent;
                        ctx.fill();
                    }
                    ctx.restore();
                }

                const headGrad = ctx.createRadialGradient(-r*0.3, -r*0.4, 0, 0, 0, r * 1.2);
                headGrad.addColorStop(0, p.light);
                headGrad.addColorStop(0.5, p.body);
                headGrad.addColorStop(1, p.dark);
                ctx.fillStyle = headGrad;
                ctx.beginPath();
                ctx.ellipse(0, -r * 0.3, r * 1.0, r * 1.15, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = p.accent + '80';
                for (let i = 0; i < 6 + level * 2; i++) {
                    const px = (Math.sin(i * 1.7) * 0.5) * r;
                    const py = (Math.cos(i * 2.3) * 0.5) * r - r * 0.3;
                    ctx.beginPath();
                    ctx.arc(px, py, r * 0.12, 0, Math.PI * 2);
                    ctx.fill();
                }

                for (let side = -1; side <= 1; side += 2) {
                    ctx.beginPath();
                    ctx.ellipse(side * r * 0.45, -r * 0.1, r * 0.32, r * 0.38, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff'; ctx.fill();
                    ctx.beginPath();
                    ctx.ellipse(side * r * 0.5, -r * 0.1, r * 0.2, r * 0.28, 0, 0, Math.PI * 2);
                    ctx.fillStyle = p.eye; ctx.fill();
                    ctx.beginPath();
                    ctx.arc(side * r * 0.42, -r * 0.22, r * 0.08, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff'; ctx.fill();
                }

                if (level >= 3) {
                    const crownColor = level === 4 ? '#ff00ff' : '#00ffff';
                    ctx.fillStyle = crownColor;
                    ctx.shadowColor = crownColor;
                    ctx.shadowBlur = 25;
                    for (let i = 0; i < 5; i++) {
                        const ang = -Math.PI/2 + (i - 2) * 0.3;
                        const dx = Math.cos(ang) * r * 0.7;
                        const dy = Math.sin(ang) * r * 0.7 - r * 1.0;
                        ctx.beginPath();
                        ctx.arc(dx, dy, r * 0.1, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }

                if (level === 4) {
                    for (let i = 0; i < 3; i++) {
                        const ang = tailPhase * 0.05 + i * Math.PI * 2 / 3;
                        const dx = Math.cos(ang) * r * 1.5;
                        const dy = Math.sin(ang) * r * 0.5 - r * 0.3;
                        ctx.fillStyle = '#ff00ff';
                        ctx.shadowColor = '#ff00ff';
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(dx, dy, r * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }
            }

            ctx.restore();
        }

        function drawHealthBar(x, y, w, h, hp, maxHp) {
            const ratio = Math.max(0, hp / maxHp);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, h/2);
            ctx.fill();

            if (ratio > 0) {
                const color = ratio > 0.6 ? '#4ade80' : ratio > 0.3 ? '#fbbf24' : '#ef4444';
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, (w - 2) * ratio, h - 2, (h-2)/2);
                ctx.fill();
            }

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, h/2);
            ctx.stroke();
        }

        function draw() {
            drawBackground();

            // Применяем зум и камеру
            ctx.save();
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);

            // Определяем видимую область в мировых координатах (для отсечения)
            const viewWorldW = VIEW_W / camera.zoom;
            const viewWorldH = VIEW_H / camera.zoom;
            const viewLeft = camera.x - 100;
            const viewRight = camera.x + viewWorldW + 100;
            const viewTop = camera.y - 100;
            const viewBottom = camera.y + viewWorldH + 100;

            foods.forEach(f => {
                if (f.x < viewLeft || f.x > viewRight) return;
                if (f.y < viewTop || f.y > viewBottom) return;

                const y = f.y + f.bob;
                const pulse = 1 + Math.sin(f.phase * 2) * 0.25;

                const glow = ctx.createRadialGradient(f.x, y, 0, f.x, y, f.r * 4 * pulse);
                glow.addColorStop(0, 'rgba(180, 255, 100, 0.7)');
                glow.addColorStop(0.5, 'rgba(124, 252, 0, 0.25)');
                glow.addColorStop(1, 'rgba(124, 252, 0, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(f.x, y, f.r * 4 * pulse, 0, Math.PI * 2);
                ctx.fill();

                const grad = ctx.createRadialGradient(f.x - f.r*0.3, y - f.r*0.3, 0, f.x, y, f.r * pulse);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.4, '#c8ff8a');
                grad.addColorStop(1, '#7cfc00');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(f.x, y, f.r * pulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(f.x - f.r*0.3, y - f.r*0.3, f.r * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 1.5 / camera.zoom;
                ctx.beginPath();
                ctx.moveTo(f.x - 2, y - f.r - 6);
                ctx.lineTo(f.x + 2, y - f.r - 6);
                ctx.moveTo(f.x, y - f.r - 8);
                ctx.lineTo(f.x, y - f.r - 4);
                ctx.stroke();
            });

            entities.forEach(e => {
                if (e.x < viewLeft - 100 || e.x > viewRight + 100) return;
                if (e.y < viewTop - 100 || e.y > viewBottom + 100) return;

                if (e.damageFlash > 0) {
                    ctx.save();
                    ctx.globalAlpha = e.damageFlash / 10;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.r * 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#ffffff';
                    ctx.fill();
                    ctx.restore();
                }

                if (e.hunting && e.aggroTimer > 0) {
                    ctx.save();
                    ctx.globalAlpha = 0.5 + Math.sin(e.aggroTimer * 0.3) * 0.3;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.r * 1.4, 0, Math.PI * 2);
                    ctx.strokeStyle = '#ff4444';
                    ctx.lineWidth = 2.5 / camera.zoom;
                    ctx.stroke();
                    ctx.restore();
                }

                drawCreature(e.x, e.y, e.r, e.type, e.color, e.angle, e.tailPhase, e.wigglePhase, false);

                if (e.hp < e.maxHp && e.hp > 0) {
                    const bw = e.r * 2;
                    const bh = 4;
                    drawHealthBar(e.x - bw/2, e.y - e.r - 10, bw, bh, e.hp, e.maxHp);
                }
            });

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            const playerColor = TYPES[player.type].color;
            const playerGlow = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, player.r * 4);
            playerGlow.addColorStop(0, playerColor + '55');
            playerGlow.addColorStop(1, playerColor + '00');
            ctx.fillStyle = playerGlow;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r * 4, 0, Math.PI * 2);
            ctx.fill();

            let shouldDrawPlayer = true;
            if (player.invulnerable > 0 && Math.floor(player.invulnerable / 4) % 2 === 0) {
                shouldDrawPlayer = false;
            }

            if (shouldDrawPlayer) {
                if (player.damageFlash > 0) {
                    ctx.save();
                    ctx.globalAlpha = player.damageFlash / 15;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, player.r * 1.8, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff0000';
                    ctx.fill();
                    ctx.restore();
                }

                drawCreature(player.x, player.y, player.r, player.type, playerColor, player.angle, player.tailPhase, player.tentaclePhase, true);

                // HP бар игрока — сохраняем размер при изменении зума
                const bw = player.r * 2.2;
                const bh = 5;
                drawHealthBar(player.x - bw/2, player.y - player.r - 14, bw, bh, player.hp, player.maxHp);
            }

            damageNumbers.forEach(d => {
                ctx.globalAlpha = d.life;
                ctx.font = `bold ${16}px "Segoe UI"`;
                ctx.fillStyle = d.color;
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.textAlign = 'center';
                ctx.strokeText(d.value, d.x, d.y);
                ctx.fillText(d.value, d.x, d.y);
            });
            ctx.globalAlpha = 1;
            ctx.textAlign = 'left';

            ctx.restore();

            // ---- UI (не масштабируется) ----
            const required = getCurrentEPRequirement();
            if (required > 0) {
                const barW = 280, barH = 26;
                const bx = VIEW_W - barW - 25, by = 20;

                ctx.fillStyle = 'rgba(13, 42, 68, 0.92)';
                ctx.strokeStyle = '#2e6a9e';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(bx, by, barW, barH, 13);
                ctx.fill();
                ctx.stroke();

                const progress = Math.min(player.ep / required, 1);
                if (progress > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.roundRect(bx + 2, by + 2, barW - 4, barH - 4, 11);
                    ctx.clip();
                    const fillGrad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
                    fillGrad.addColorStop(0, '#ffd700');
                    fillGrad.addColorStop(1, '#fff5b0');
                    ctx.fillStyle = fillGrad;
                    ctx.fillRect(bx + 2, by + 2, (barW - 4) * progress, barH - 4);
                    ctx.restore();
                }

                const tier = TYPES[player.type].tier;
                const tierLabels = ['', '🌿 ЭВОЛЮЦИЯ', '⚡ ПРОДВИНУТАЯ', '🔥 МОНСТР', '👑 БОГ', '🌟 АБСОЛЮТ'];
                const label = `${tierLabels[tier] || 'ФИНАЛ'}: ⚡ ${player.ep}/${required}`;

                ctx.font = 'bold 14px "Segoe UI"';
                ctx.fillStyle = '#fff5b0';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 12;
                ctx.textAlign = 'center';
                ctx.fillText(label, bx + barW/2, by + 17);
                ctx.textAlign = 'left';
                ctx.shadowBlur = 0;
            } else {
                ctx.font = 'bold 18px "Segoe UI"';
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 20;
                ctx.textAlign = 'center';
                ctx.fillText('🌟 АБСОЛЮТНАЯ ФОРМА 🌟', VIEW_W - 200, 38);
                ctx.textAlign = 'left';
                ctx.shadowBlur = 0;
            }

            drawMinimap();

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, VIEW_W, VIEW_H);
                ctx.font = 'bold 56px "Segoe UI"';
                ctx.fillStyle = '#ff4d4d';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 30;
                ctx.textAlign = 'center';
                ctx.fillText('ТЫ ПОГИБ', VIEW_W/2, VIEW_H/2 - 30);
                ctx.font = '24px "Segoe UI"';
                ctx.fillStyle = '#ffb3b3';
                ctx.shadowBlur = 10;
                ctx.fillText(isMobile ? 'Коснись экрана для перезапуска' : 'Нажми R, чтобы начать заново', VIEW_W/2, VIEW_H/2 + 50);
                ctx.textAlign = 'left';
                ctx.shadowBlur = 0;
            } else if (win) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, VIEW_W, VIEW_H);
                ctx.font = 'bold 48px "Segoe UI"';
                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = '#ffaa00';
                ctx.shadowBlur = 40;
                ctx.textAlign = 'center';
                ctx.fillText('🌟 АБСОЛЮТ ДОСТИГНУТ! 🌟', VIEW_W/2, VIEW_H/2 - 60);
                ctx.font = '32px "Segoe UI"';
                ctx.fillStyle = '#fff5b0';
                ctx.shadowBlur = 20;
                ctx.fillText(`${TYPES[player.type].emoji} ${TYPES[player.type].name}`, VIEW_W/2, VIEW_H/2);
                ctx.font = '22px "Segoe UI"';
                ctx.fillStyle = '#fff5b0';
                ctx.shadowBlur = 10;
                ctx.fillText(`Очки эволюции: ⚡ ${player.ep}`, VIEW_W/2, VIEW_H/2 + 50);
                ctx.fillText(isMobile ? 'Коснись экрана для рестарта' : 'Нажми R, чтобы сыграть снова', VIEW_W/2, VIEW_H/2 + 100);
                ctx.textAlign = 'left';
                ctx.shadowBlur = 0;
            }
        }

        function drawMinimap() {
            const mw = isMobile ? 110 : 160;
            const mh = isMobile ? 82 : 120;
            const mx = VIEW_W - mw - 20;
            const my = VIEW_H - mh - (isMobile ? 170 : 20);

            ctx.fillStyle = 'rgba(5, 15, 28, 0.8)';
