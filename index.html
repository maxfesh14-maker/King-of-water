            ctx.strokeStyle = '#2e6a9e';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(mx, my, mw, mh, 8);
            ctx.fill();
            ctx.stroke();

            const scaleX = mw / WORLD_W;
            const scaleY = mh / WORLD_H;
            entities.forEach(e => {
                if (e.type === 'PLANKTON') return;
                const tier = TYPES[e.type].tier;
                if (tier >= 5) {
                    ctx.fillStyle = '#ffd700';
                } else if (e.hunting) {
                    ctx.fillStyle = '#ff2222';
                } else {
                    ctx.fillStyle = e.color;
                }
                ctx.beginPath();
                ctx.arc(mx + e.x * scaleX, my + e.y * scaleY, tier >= 4 ? 3 : (e.hunting ? 2.5 : 1.5), 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.fillStyle = '#7cfc00';
            foods.forEach(f => {
                ctx.fillRect(mx + f.x * scaleX - 0.5, my + f.y * scaleY - 0.5, 1.5, 1.5);
            });

            // Показываем видимую область камеры на миникарте
            const viewWorldW = VIEW_W / camera.zoom;
            const viewWorldH = VIEW_H / camera.zoom;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 1;
            ctx.strokeRect(
                mx + camera.x * scaleX,
                my + camera.y * scaleY,
                viewWorldW * scaleX,
                viewWorldH * scaleY
            );

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(mx + player.x * scaleX, my + player.y * scaleY, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = TYPES[player.type].color;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        let lastTime = 0;
        function gameLoop(time) {
            const dt = Math.min((time - lastTime) / 16.67, 2);
            lastTime = time;
            update(dt);
            draw();
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', (e) => {
            if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','a','d','w','s','A','D','W','S'].includes(e.key)) {
                e.preventDefault();
            }
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
                if (gameOver || win) initGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
            if (e.key.startsWith('Arrow')) e.preventDefault();
        });

        window.addEventListener('blur', () => {
            for (let k in keys) keys[k] = false;
        });

        canvas.addEventListener('touchstart', (e) => {
            if (gameOver || win) {
                e.preventDefault();
                initGame();
            }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.evolution-modal')) return;
            e.preventDefault();
        }, { passive: false });

        // ---------- УПРАВЛЕНИЕ ЗУМОМ КОЛЕСОМ МЫШИ (опционально) ----------
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            // Позволяем игроку вручную подстроить зум, но не больше авто-зума
            const zoomStep = e.deltaY > 0 ? 0.95 : 1.05;
            let newZoom = camera.zoom * zoomStep;
            // Ограничения: от 0.3 до целевого зума (не даём приблизиться сильнее авто)
            newZoom = Math.max(0.3, Math.min(camera.targetZoom * 1.3, newZoom));
            camera.zoom = newZoom;
        }, { passive: false });

        initGame();
        requestAnimationFrame(gameLoop);
    })();
</script>
</body>
</html>
